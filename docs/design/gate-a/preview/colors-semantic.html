<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Semantic Tokens" subtitle="fg / surface / accent on paper vs ink" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;min-height:100%}
  .pane{padding:20px 22px}
  .light{background:var(--paper);color:var(--ink)}
  .dark{background:var(--ink);color:var(--paper)}
  .lab{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.28em;font-size:11px;font-weight:600;margin:0 0 14px;opacity:.7}
  .tok{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .dotc{width:16px;height:16px;border-radius:3px;border:1px solid rgba(128,128,128,.3)}
  code{font-family:ui-monospace,monospace;font-size:12px;opacity:.85}
</style></head>
<body>
  <div class="pane light">
    <p class="lab">Semantic · Paper</p>
    <div class="tok"><span class="dotc" style="background:#16140F"></span><code>--fg1</code> headings</div>
    <div class="tok"><span class="dotc" style="background:#4A453C"></span><code>--fg2</code> body</div>
    <div class="tok"><span class="dotc" style="background:#8A857B"></span><code>--fg-muted</code> meta</div>
    <div class="tok"><span class="dotc" style="background:#C9A24B"></span><code>--accent</code> gold</div>
    <div class="tok"><span class="dotc" style="background:#FFFFFF"></span><code>--surface</code> white</div>
  </div>
  <div class="pane dark">
    <p class="lab" style="color:var(--gold-pale);opacity:1">Semantic · Ink</p>
    <div class="tok"><span class="dotc" style="background:#F6F1E7"></span><code>--fg1</code> headings</div>
    <div class="tok"><span class="dotc" style="background:#C8C1B2"></span><code>--fg2</code> body</div>
    <div class="tok"><span class="dotc" style="background:#8F897C"></span><code>--fg-muted</code> meta</div>
    <div class="tok"><span class="dotc" style="background:#E1B34B"></span><code>--accent</code> gold</div>
    <div class="tok"><span class="dotc" style="background:#211E18"></span><code>--surface</code> ink-2</div>
  </div>
</body></html>
