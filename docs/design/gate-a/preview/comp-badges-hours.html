<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Badges & Hours" subtitle="Pill badges + opening-hours rows" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:24px 26px;font-family:var(--font-body);color:var(--ink)}
  .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 10px}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .badge{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;
    padding:6px 12px;border-radius:var(--r-pill)}
  .b-gold{background:var(--gold);color:#1a160c}
  .b-out{background:transparent;color:var(--gold-deep);border:1px solid var(--gold)}
  .b-ink{background:var(--ink);color:var(--gold-pale)}
  .hours{max-width:320px;border-top:1px solid var(--border)}
  .hr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .hr .d{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
  .hr .t{color:var(--fg2)}
  .closed{color:var(--gold-deep)}
</style></head>
<body>
  <p class="lbl">Badges / tags</p>
  <div class="badges">
    <span class="badge b-gold">Open</span>
    <span class="badge b-out">Walk-in</span>
    <span class="badge b-ink">Barber Wanted</span>
  </div>
  <p class="lbl">Opening hours row</p>
  <div class="hours">
    <div class="hr"><span class="d">Tue–Sat</span><span class="t">10:00 – 20:00</span></div>
    <div class="hr"><span class="d">Mon · Sun</span><span class="t closed">Check Instagram</span></div>
  </div>
</body></html>
