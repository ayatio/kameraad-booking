<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Form Inputs" subtitle="Text + select with gold focus ring" viewport="700x190" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:24px 26px;font-family:var(--font-body);color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:600px}
  label{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:var(--fg-muted);margin:0 0 6px}
  input,select{width:100%;box-sizing:border-box;font-family:var(--font-body);font-size:15px;color:var(--ink);
    padding:11px 13px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-sm);outline:none}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}
  input::placeholder{color:var(--stone)}
  .focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}
</style></head>
<body>
  <div class="grid">
    <div><label>Name</label><input placeholder="Jan Janssens"></div>
    <div><label>Phone</label><input class="focus" value="+32 486 33 67 14"></div>
    <div><label>Barber</label><select><option>Avraz</option><option>Adil</option><option>Simar</option><option>Bas</option></select></div>
    <div><label>Service</label><select><option>Knippen</option><option>Baard</option><option>Knippen + baard</option></select></div>
  </div>
</body></html>
