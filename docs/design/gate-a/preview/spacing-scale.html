<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Spacing Scale" subtitle="4px base step, 4 → 96" viewport="700x270" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:22px 26px;color:var(--ink);font-family:var(--font-body)}
  .row{display:flex;align-items:center;gap:12px;margin:7px 0}
  .bar{height:14px;background:var(--gold);border-radius:2px}
  .lbl{font-size:12px;color:var(--fg-muted);width:74px;flex:none}
</style></head>
<body>
  <div class="row"><span class="lbl">4 · space-1</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">8 · space-2</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">12 · space-3</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lbl">16 · space-4</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">24 · space-5</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">32 · space-6</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">48 · space-7</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lbl">64 · space-8</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lbl">96 · space-9</span><div class="bar" style="width:96px"></div></div>
</body></html>
