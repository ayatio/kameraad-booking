<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Team Cards" subtitle="B&W portrait cards with book link" viewport="700x310" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:22px 26px;font-family:var(--font-body);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:640px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-1)}
  .ph{aspect-ratio:1/1;overflow:hidden;background:var(--ink)}
  .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
  .body{padding:12px 13px 15px;text-align:center}
  .nm{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-weight:600;font-size:17px;margin:0}
  .rl{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--gold);margin:7px 0 0}
  .rl::before,.rl::after{content:"";height:1px;width:24px;background:currentColor}
  .lk{font-family:var(--font-body);font-size:12px;color:var(--gold-deep);letter-spacing:.04em}
</style></head>
<body>
  <div class="grid">
    <div class="card"><div class="ph"><img src="../assets/team-adil.jpg" alt=""></div><div class="body"><p class="nm">Adil</p><div class="rl"><span class="lk">Book</span></div></div></div>
    <div class="card"><div class="ph"><img src="../assets/team-simar.jpg" alt=""></div><div class="body"><p class="nm">Simar</p><div class="rl"><span class="lk">Book</span></div></div></div>
    <div class="card"><div class="ph"><img src="../assets/team-bas.jpg" alt=""></div><div class="body"><p class="nm">Bas</p><div class="rl"><span class="lk">Book</span></div></div></div>
  </div>
</body></html>
