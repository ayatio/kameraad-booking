<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Elevation" subtitle="Three soft ink-tinted shadow steps" viewport="700x210" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:30px 26px;color:var(--ink);font-family:var(--font-body)}
  .row{display:flex;gap:30px;align-items:flex-end}
  .cell{text-align:center}
  .box{width:120px;height:72px;background:var(--white);border-radius:var(--r-md)}
  .nm{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;margin-top:14px}
  .lbl{font-size:11px;color:var(--fg-muted);margin-top:3px}
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="nm">Shadow 1</div><div class="lbl">resting · hairline</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="nm">Shadow 2</div><div class="lbl">card lift</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="nm">Shadow 3</div><div class="lbl">overlay · modal</div></div>
  </div>
</body></html>
