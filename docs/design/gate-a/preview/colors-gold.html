<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Gold" subtitle="The single brand accent — four golds" viewport="700x150" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-body);padding:22px 24px;color:var(--fg1)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sw{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border)}
  .chip{height:78px}
  .meta{padding:8px 10px;background:var(--white)}
  .name{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:600}
  .hex{font-size:12px;color:var(--fg-muted);letter-spacing:.02em}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#C9A24B"></div><div class="meta"><div class="name">Gold</div><div class="hex">#C9A24B</div></div></div>
    <div class="sw"><div class="chip" style="background:#E1B34B"></div><div class="meta"><div class="name">Gold Bright</div><div class="hex">#E1B34B</div></div></div>
    <div class="sw"><div class="chip" style="background:#E8D29F"></div><div class="meta"><div class="name">Gold Pale</div><div class="hex">#E8D29F</div></div></div>
    <div class="sw"><div class="chip" style="background:#9A7B33"></div><div class="meta"><div class="name">Gold Deep</div><div class="hex">#9A7B33</div></div></div>
  </div>
</body></html>
