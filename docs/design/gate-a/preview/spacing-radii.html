<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Corner Radii" subtitle="Small radii — slab-and-tile world" viewport="700x190" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:24px 26px;color:var(--ink);font-family:var(--font-body)}
  .row{display:flex;gap:22px;align-items:flex-end}
  .cell{text-align:center}
  .box{width:88px;height:62px;background:var(--white);border:1px solid var(--border);box-shadow:var(--shadow-1)}
  .lbl{font-size:12px;color:var(--fg-muted);margin-top:8px}
  .nm{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;color:var(--ink)}
</style></head>
<body>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius:2px"></div><div class="nm">SM</div><div class="lbl">2px</div></div>
    <div class="cell"><div class="box" style="border-radius:4px"></div><div class="nm">MD</div><div class="lbl">4px</div></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><div class="nm">LG</div><div class="lbl">8px</div></div>
    <div class="cell"><div class="box" style="border-radius:999px;width:120px"></div><div class="nm">Pill</div><div class="lbl">999px</div></div>
  </div>
</body></html>
