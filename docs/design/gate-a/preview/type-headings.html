<!DOCTYPE html>
<!-- @dsCard group="Type" name="Heading Scale" subtitle="H1 / H2 / H3 in Playfair Display serif" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:24px 28px;color:var(--ink)}
  .item{display:flex;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:0}
  .tag{font-family:var(--font-body);font-size:11px;color:var(--fg-muted);width:128px;flex:none;letter-spacing:.04em}
  h1,h2,h3{font-family:var(--font-serif);letter-spacing:-.01em;margin:0;line-height:1.02;font-weight:500;color:var(--ink)}
  h1{font-size:44px}h2{font-size:32px}h3{font-size:23px}
  em{font-style:italic;color:var(--gold-deep)}
</style></head>
<body>
  <div class="item"><span class="tag">H1 · Playfair 500</span><h1>De laatste <em>herenretraite</em></h1></div>
  <div class="item"><span class="tag">H2 · Playfair 500</span><h2>Boek je stoel.</h2></div>
  <div class="item"><span class="tag">H3 · Playfair 500</span><h3>Onze barbiers</h3></div>
</body></html>
