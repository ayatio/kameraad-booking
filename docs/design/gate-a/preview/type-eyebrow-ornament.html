<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Eyebrow & Ornament" subtitle="Spaced caps + gold hairline motif" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:30px 28px;color:var(--ink);text-align:center}
  .km-ornament{margin-bottom:14px}
  .eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.32em;font-size:13px;font-weight:500;color:var(--gold-deep);margin:0}
  h2{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em;font-size:34px;font-weight:600;margin:8px 0 0;color:var(--ink)}
  .note{font-family:var(--font-body);font-size:12px;color:var(--fg-muted);margin:22px 0 0}
</style></head>
<body>
  <div class="km-ornament"><span class="dot"></span></div>
  <p class="eyebrow">Eyebrow · spaced caps</p>
  <h2>Section header</h2>
  <p class="note">The hairline ornament (.km-ornament) frames headers — lifted from the gold wordmark flourishes.</p>
</body></html>
