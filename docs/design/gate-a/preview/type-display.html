<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display Type" subtitle="Playfair Display — editorial serif, gold italic accent" viewport="700x210" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink);padding:26px 28px;color:var(--paper)}
  .eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.32em;font-size:12px;font-weight:500;color:var(--gold-pale);margin:0 0 8px}
  .big{font-family:var(--font-serif);font-weight:700;letter-spacing:-.01em;line-height:.92;font-size:78px;color:var(--paper);margin:0}
  .big em{font-style:italic;color:var(--gold-pale)}
  .sub{font-family:var(--font-body);font-size:13px;color:#8F897C;margin:14px 0 0;letter-spacing:.02em}
</style></head>
<body>
  <p class="eyebrow">Display · Playfair Display 700</p>
  <p class="big">Stille <em>klasse</em></p>
  <p class="sub">Editorial high-contrast serif, sentence case, −0.01em tracking, gold italic accent.</p>
</body></html>
